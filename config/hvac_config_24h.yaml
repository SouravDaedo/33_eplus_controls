# HVAC Control Configuration
# This file defines state space, action space, and simulation parameters

# Simulation Parameters
simulation:
  # IDF file (relative to project root); overridden by --idf if provided
  idf_path: "energyplus/control_models/MediumOffice_IAQ_25_2.idf"
  # Timesteps per hour (4 = 15 min, 12 = 5 min, 1 = 60 min)
  timesteps_per_hour: 4
  # Training window: run RL only between this date/time and end date/time (RunPeriod = this full range)
  training_window:
    start_month: 4
    start_day: 12
    start_hour: 3          # 3 AM (hour 0-24, 24 = end of day)
    end_month: 7
    end_day: 30
    end_hour: 24          # 23:59 → use 24 for end of day
  # Episode duration in hours: [min, max]; sampled at start of each episode (e.g. 12–36 h)
  episode_duration_hours: [24, 24]
  # If true, a custom IDF is created with RunPeriod = training_window start to end date
  custom_period:
    enabled: true
  # Outdoor air CO2 (ppm). Static value applied when creating custom IDF when outdoor_co2_csv_path is not set.
  outdoor_co2_ppm: 400
  # Path to CSV of outdoor CO2 (ppm) per time step. If set, custom IDF uses Schedule:File for time-varying outdoor CO2.
  # CSV columns: month, day, hour, ppm  (hour 0-23)  OR  datetime, ppm
  outdoor_co2_csv_path: null   # e.g. "data/outdoor_co2_2023.csv"
  # When using outdoor_co2_csv_path: fallback ppm for missing hours when building the 8760 schedule.
  outdoor_co2_fallback_ppm: 400
  
# Weather file options
weather_files:
  default: "weather/USA_CO_Denver.Intl.AP.724650_TMY3.epw"
  summer: "weather/atlanta_summer_2024/weather_lat33.75_lon-84.39_2024-06-01_2024-09-30.epw"
  chicago: "weather/chicago/TMY_lat41.88_lon-87.63.epw"
  atlanta_2023: "weather/atlanta_2023/hourly_lat33.75_lon-84.39_2023-2023.epw"
  chicago_2020: "weather/chicago_2020/hourly_lat41.88_lon-87.63_2020-2020.epw"

# State Space Configuration
state_space:
  # Zone temperatures
  # mode: "zones"          — one feature per zone (count must be 15)
  # mode: "perimeter_core" — core_bottom/mid/top + avg perimeter temp per floor (count must be 6)
  # mode: "floor"          — average temp of all zones on each floor: bottom, mid, top (count must be 3)
  zone_temps:
    mode: "floor"
    count: 3
    description: "Average zone air temperature (°C) per floor: bottom, mid, top"
  
  # Current weather conditions
  current_weather:
    - name: "outdoor_air_temperature"
      description: "Outdoor air dry bulb temperature (°C)"
    - name: "relative_humidity"
      description: "Outdoor relative humidity (0-1)"
    - name: "cloud_cover"
      description: "Cloud cover fraction (0-1)"
  
  # Weather forecast. Real forward-looking values read directly from the EPW file via
  # EnergyPlus's today/tomorrow weather API (perfect foresight, not a lagged history
  # buffer). Each variable specifies its own list of timesteps-ahead to forecast —
  # they don't need to match (e.g. look further ahead on temperature than humidity).
  weather_forecast:
    outdoor_air_temperature: [4, 8, 12]
    relative_humidity: [4, 8, 12]
    cloud_cover: [4, 8, 12]
    description: "Per-variable forecast offsets (zone timesteps ahead), EPW look-ahead"
    # Forecast error: Gaussian noise added to each forecast value so the agent sees
    # realistic forecast uncertainty instead of perfect foresight. Std grows linearly
    # with lead time (offset timesteps ahead) — e.g. oat_std_per_step 0.3 means a
    # forecast 5 timesteps out has std 1.5°C. Set enabled: false for perfect forecast.
    noise:
      enabled: true
      oat_std_per_step: 0.3          # °C std per timestep of lead time
      humidity_std_per_step: 1.0     # % std per timestep of lead time
      cloud_cover_std_per_step: 1.0  # °C std per timestep of lead time (sky temp proxy)

  # Optional past weather (lagged history). Disabled by default; enable to also give
  # the agent short-term historical weather trend features alongside the forecast.
  weather_history:
    enabled: false
    horizon: 6  # Number of past timesteps to include
    variables: 3  # temp, humidity, cloud_cover
    description: "Past observed weather for previous N timesteps (lag features)"

  # Time features
  time_features:
    - name: "hour_of_day"
      description: "Hour of day normalized (0-1)"
    - name: "day_of_week"
      description: "Day of week normalized (0-1)"
    - name: "month_of_year"
      description: "Month of year normalized (0-1)"
  
  # Previous actions
  previous_actions:
    count: 0
    initial_value: []
    description: "Previous actions excluded from state"
  
  # CO2 (ppm) – outdoor and zone concentrations
  outdoor_co2_ppm:
    count: 1
    description: "Outdoor air CO2 concentration (ppm)"
  floor_co2_ppm:
    count: 3
    description: "Average zone return air CO2 concentration (ppm) per floor: bottom, mid, top"

  # Electricity RTP ($/kWh) observed by the agent: current hour + hour-ahead published price
  rtp_price:
    count: 2
    description: "Current and 1-hour-ahead electricity RTP ($/kWh)"

# Action Space Configuration
action_space:
  # Comfort band center offset from base temperature (shifts both heating and cooling setpoints equally)
  sp_offset:
    min: -5.0
    max: 5.0
    description: "Setpoint offset — shifts heating and cooling setpoints equally (°C)"
  
  # Temperature deadband between heating and cooling
  deadband:
    min: 2
    max: 10.0
    description: "Temperature deadband (°C)"
  
  # AHU outdoor-air controller mass flow command (keeps legacy key name for action compatibility)
  airflow_multiplier:
    min: 0.0
    max: 6.0
    description: "AHU outdoor-air controller mass flow command (kg/s); economizer-scale range"

# Control Parameters
control:
  base_temperature: 22.0  # Base temperature for setpoints (°C)
  min_airflow: 0.01      # Legacy infiltration airflow setting; not used by RL AHU OA controller action
  max_airflow: 0.1       # Legacy infiltration airflow setting; not used by RL AHU OA controller action

# Reward Function Weights
# Dollar energy + PPD/CO2 productivity costs. Optional $/m² normalization for transfer.
# Productivity translation sources (see hvac_config.yaml for full citations):
#   PPD: ASHRAE 55; Kosonen & Tan; Lan/Wargocki/Lian (2011) Energy and Buildings;
#        Seppänen/Fisk thermal-performance reviews.
#   CO2/IAQ: Seppänen/Fisk/Lei (2006) Indoor Air; Wargocki et al. (2000) Indoor Air;
#            Wargocki CO2–performance analyses; Allen et al. (2016) COGfx.
reward:
  # Electric/gas are already $ (kWh × price); no energy_weight / gas_weight
  energy_price_per_kwh: 0.1
  gas_price_per_kwh: 0.017
  realtime_price:
    enabled: true
    type: "csv"
    constant_price: 0.1
    csv_path: "data/rtp_prices_2023_0412_to_0730.csv"
    fallback_price: 0.1
    tou:
      peak:    { hours: [12, 13, 14, 15, 16, 17, 18], price: 0.15 }
      off_peak: { hours: [0, 1, 2, 3, 4, 5, 6, 22, 23], price: 0.08 }
      mid:     { price: 0.10 }

  cost_normalization:
    mode: "per_m2"         # "absolute" | "per_m2" — use $/m² for transferable cost-based reward
    floor_area_m2: 4982.0  # set per building when mode=per_m2

  labor_cost_per_person_hour: 40.0

  # Online PPD/CO2 scales vs observed energy $ (see README adaptive_balancing)
  adaptive_balancing:
    enabled: true
    ema_alpha: 0.01
    min_samples: 100
    comfort_target_ratio: 1.0
    co2_target_ratio: 1.0
    weight_min: 0.0
    weight_max: 1.0
    initial_scale: 1.0
    min_mean: 1.0e-12

  thermal_comfort_model: "ppd_productivity"   # "temperature" | "ppd" | "ppd_productivity"
  comfort_weight: 1.0
  comfort_threshold: 1.0
  ppd_acceptable_max: 10.0
  ppd_penalty_scale: 0.01
  ppd_reference: 10.0
  ppd_productivity_loss_per_percent: 0.5
  ppd_max_productivity_loss: 0.15

  co2_weight: 1.0
  co2_model: "productivity"  # "threshold" | "productivity"
  co2_threshold_ppm: 1000.0
  co2_penalty_scale: 0.001
  co2_reference_ppm: 800.0
  co2_productivity_loss_per_100ppm: 0.01
  co2_max_productivity_loss: 0.15

  setpoint_weight: 0.0
  demand_weight: 0.0
  demand_threshold: 5.0
  description: "Dollar energy + PPD/CO2 productivity costs; optional $/m2 normalization"


# Occupancy Events: transient occupancy spikes/drops layered on top of the normal
# People schedule, applied to specific zones during specific hours of the day
# throughout the simulation. EnergyPlus's People-driven CO2 generation model reacts
# to the actual occupant count each timestep, so these events directly change
# per-zone (and floor_co2_ppm) CO2 buildup — no separate CO2 math needed.
occupancy_events:
  enabled: true
  # Name of the "Number of People" schedule shared by the model's People objects
  # (must match the IDF). Read every timestep (independent of any event override)
  # so each event's delta scales the *real* scheduled occupancy for that hour,
  # not a hardcoded assumption.
  schedule_name: "BLDG_OCC_SCH_wo_SB"
  events:
    - name: "morning_meeting_spike"
      # Zone names (must match CONTROLLED_ZONE_NAMES in rl_hvac_control.py), or a
      # floor shorthand: "bottom" | "mid" | "top" (expands to all zones on that floor).
      zones: ["Perimeter_bot_ZN_1", "Perimeter_bot_ZN_2"]
      hours: [9, 10]          # hour-of-day (0-23), active every simulated day
      delta: 0.4               # +40% occupancy vs. the scheduled baseline for that hour
    - name: "afternoon_lull"
      zones: ["top"]
      hours: [14, 15]
      delta: -0.3              # -30% occupancy vs. the scheduled baseline for that hour

# Zone Configuration
zones:
  # List of zone names in the EnergyPlus model
  names:
    - "CORE_BOTTOM"
    - "CORE_MIDDLE"
    - "CORE_TOP"
    - "PERIMETER_BOTTOM_NORTH"
    - "PERIMETER_BOTTOM_EAST"
    - "PERIMETER_BOTTOM_SOUTH"
    - "PERIMETER_BOTTOM_WEST"
    - "PERIMETER_MIDDLE_NORTH"
    - "PERIMETER_MIDDLE_EAST"
    - "PERIMETER_MIDDLE_SOUTH"
    - "PERIMETER_MIDDLE_WEST"
    - "PERIMETER_TOP_NORTH"
    - "PERIMETER_TOP_EAST"
    - "PERIMETER_TOP_SOUTH"
    - "PERIMETER_TOP_WEST"
  
  # Zone groups for different control strategies
  groups:
    core: ["CORE_BOTTOM", "CORE_MIDDLE", "CORE_TOP"]
    perimeter_bottom: ["PERIMETER_BOTTOM_NORTH", "PERIMETER_BOTTOM_EAST", "PERIMETER_BOTTOM_SOUTH", "PERIMETER_BOTTOM_WEST"]
    perimeter_middle: ["PERIMETER_MIDDLE_NORTH", "PERIMETER_MIDDLE_EAST", "PERIMETER_MIDDLE_SOUTH", "PERIMETER_MIDDLE_WEST"]
    perimeter_top: ["PERIMETER_TOP_NORTH", "PERIMETER_TOP_EAST", "PERIMETER_TOP_SOUTH", "PERIMETER_TOP_WEST"]

# State Normalization (min-max scaling to [0, 1])
normalization:
  enabled: true
  bounds:
    zone_temp:     [10.0,  40.0]   # °C
    oat:           [-20.0, 50.0]   # °C
    humidity:      [0.0,   100.0]  # %
    sky_temp:      [-30.0, 40.0]   # °C
    hour_of_day:   [0.0,   1.0]    # already [0,1]
    day_of_week:   [0.0,   1.0]    # already [0,1]
    month_of_year: [0.0,   1.0]    # already [0,1]
    prev_action:   [-1.0,  1.0]    # tanh output
    outdoor_co2:   [300.0, 1200.0] # ppm
    floor_co2:     [300.0, 2000.0] # ppm
    rtp_price:     [0.02,  0.60]   # $/kWh
