# HVAC Control Configuration
# This file defines state space, action space, and simulation parameters

# Simulation Parameters
simulation:
  # IDF file (relative to project root); overridden by --idf if provided
  idf_path: "energyplus/control_models/MediumOffice_IAQ.idf"
  # Timesteps per hour (4 = 15 min, 12 = 5 min, 1 = 60 min)
  timesteps_per_hour: 4
  # Training window: run RL only between this date/time and end date/time (RunPeriod = this full range)
  training_window:
    start_month: 4
    start_day: 12
    start_hour: 3          # 3 AM (hour 0-24, 24 = end of day)
    end_month: 7
    end_day: 30
    end_hour: 24          # 23:59 → use 24 for end of day
  # Episode duration in hours: [min, max]; sampled at start of each episode (e.g. 12–36 h)
  episode_duration_hours: [12, 36]
  # If true, a custom IDF is created with RunPeriod = training_window start to end date
  custom_period:
    enabled: true
  # Outdoor air CO2 (ppm). Static value applied when creating custom IDF when outdoor_co2_csv_path is not set.
  outdoor_co2_ppm: 400
  # Path to CSV of outdoor CO2 (ppm) per time step. If set, custom IDF uses Schedule:File for time-varying outdoor CO2.
  # CSV columns: month, day, hour, ppm  (hour 0-23)  OR  datetime, ppm
  outdoor_co2_csv_path: null   # e.g. "data/outdoor_co2_2023.csv"
  # When using outdoor_co2_csv_path: fallback ppm for missing hours when building the 8760 schedule.
  outdoor_co2_fallback_ppm: 400
  
# Weather file options
weather_files:
  default: "weather/USA_CO_Denver.Intl.AP.724650_TMY3.epw"
  summer: "weather/atlanta_summer_2024/weather_lat33.75_lon-84.39_2024-06-01_2024-09-30.epw"
  chicago: "weather/chicago/TMY_lat41.88_lon-87.63.epw"
  atlanta_2023: "weather/atlanta_2023/hourly_lat33.75_lon-84.39_2023-2023.epw"
  chicago_2020: "weather/chicago_2020/hourly_lat41.88_lon-87.63_2020-2020.epw"

# State Space Configuration
state_space:
  # Zone temperatures
  zone_temps:
    count: 5
    description: "Zone air temperatures (°C)"
  
  # Current weather conditions
  current_weather:
    - name: "outdoor_air_temperature"
      description: "Outdoor air dry bulb temperature (°C)"
    - name: "relative_humidity"
      description: "Outdoor relative humidity (0-1)"
    - name: "cloud_cover"
      description: "Cloud cover fraction (0-1)"
  
  # Weather forecast (timesteps ahead)
  weather_forecast:
    horizon: 6  # Number of timesteps to forecast
    variables: 3  # temp, humidity, cloud_cover
    description: "Weather forecast for next 6 timesteps"
  
  # Time features
  time_features:
    - name: "hour_of_day"
      description: "Hour of day normalized (0-1)"
    - name: "day_of_week"
      description: "Day of week normalized (0-1)"
    - name: "month_of_year"
      description: "Month of year normalized (0-1)"
  
  # Previous actions
  previous_actions:
    count: 3
    description: "Previous heating offset, deadband, airflow multiplier"
  
  # CO2 (ppm) – outdoor and zone concentrations
  outdoor_co2_ppm:
    count: 1
    description: "Outdoor air CO2 concentration (ppm)"
  zone_co2_ppm:
    count: 5
    description: "Zone air CO2 concentration (ppm) for controlled zones; same order as zone_temps"

# Action Space Configuration
action_space:
  # Heating setpoint offset from base temperature
  heating_offset:
    min: -5.0
    max: 5.0
    description: "Heating setpoint offset (°C)"
  
  # Temperature deadband between heating and cooling
  deadband:
    min: 2
    max: 10.0
    description: "Temperature deadband (°C)"
  
  # Airflow multiplier
  airflow_multiplier:
    min: 0.1
    max: 2.0
    description: "Outdoor air flow multiplier (0.1-2.0)"

# Control Parameters
control:
  base_temperature: 22.0  # Base temperature for setpoints (°C)
  min_airflow: 0.01      # Minimum airflow (m³/s)
  max_airflow: 0.1       # Maximum airflow (m³/s)

# Reward Function Weights
reward:
  energy_weight: 0.4        # Weight for energy consumption penalty (0-1)
  # Energy cost = (power_W / 1000) * dt_hours * price; price from realtime_price or energy_price_per_kwh
  energy_price_per_kwh: 0.1 # Default/fallback price ($/kWh) when realtime_price is disabled
  # Real-time price: used in reward and stored in log (energy_price_used)
  realtime_price:
    enabled: false         # Set true to use time-varying price
    type: "constant"       # "constant" | "tou"
    constant_price: 0.1    # When type is constant ($/kWh)
    tou:                   # When type is tou (hours 0-23)
      peak:    { hours: [12, 13, 14, 15, 16, 17, 18], price: 0.15 }
      off_peak: { hours: [0, 1, 2, 3, 4, 5, 6, 22, 23], price: 0.08 }
      mid:     { price: 0.10 }
  comfort_weight: 0.5       # Weight for thermal comfort penalty (0-1)
  setpoint_weight: 0.1      # Weight for setpoint reasonableness penalty (0-1)
  demand_weight: 0.2        # Weight for demand spike penalty (0-1)
  # Thermal comfort model: "temperature" = penalty from zone temp vs base_temp ± threshold; "ppd" = penalty from Fanger PPD
  thermal_comfort_model: "temperature"   # "temperature" | "ppd"
  comfort_threshold: 1.0     # Temperature deviation threshold (°C) (used when thermal_comfort_model is temperature)
  ppd_acceptable_max: 10.0    # PPD (%) above which penalty applies (used when thermal_comfort_model is ppd)
  ppd_penalty_scale: 0.01    # Penalty per zone = max(0, PPD - ppd_acceptable_max) * ppd_penalty_scale, then * comfort_weight
  demand_threshold: 5.0      # Power demand threshold for penalty (kW)
  description: "Configurable weights for reward function components"

# Zone Configuration
zones:
  # List of zone names in the EnergyPlus model
  names:
    - "CORE_BOTTOM"
    - "CORE_MIDDLE"
    - "CORE_TOP"
    - "PERIMETER_BOTTOM_NORTH"
    - "PERIMETER_BOTTOM_EAST"
    - "PERIMETER_BOTTOM_SOUTH"
    - "PERIMETER_BOTTOM_WEST"
    - "PERIMETER_MIDDLE_NORTH"
    - "PERIMETER_MIDDLE_EAST"
    - "PERIMETER_MIDDLE_SOUTH"
    - "PERIMETER_MIDDLE_WEST"
    - "PERIMETER_TOP_NORTH"
    - "PERIMETER_TOP_EAST"
    - "PERIMETER_TOP_SOUTH"
    - "PERIMETER_TOP_WEST"
  
  # Zone groups for different control strategies
  groups:
    core: ["CORE_BOTTOM", "CORE_MIDDLE", "CORE_TOP"]
    perimeter_bottom: ["PERIMETER_BOTTOM_NORTH", "PERIMETER_BOTTOM_EAST", "PERIMETER_BOTTOM_SOUTH", "PERIMETER_BOTTOM_WEST"]
    perimeter_middle: ["PERIMETER_MIDDLE_NORTH", "PERIMETER_MIDDLE_EAST", "PERIMETER_MIDDLE_SOUTH", "PERIMETER_MIDDLE_WEST"]
    perimeter_top: ["PERIMETER_TOP_NORTH", "PERIMETER_TOP_EAST", "PERIMETER_TOP_SOUTH", "PERIMETER_TOP_WEST"]
